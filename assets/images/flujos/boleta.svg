<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" role="img" aria-labelledby="title desc">
<title id="title">Revisión de boleta de compra</title><desc id="desc">Ejemplo ilustrativo de dos sacos de sal. La persona debe revisar la presentación configurada antes de confirmar.</desc>
<rect width="480" height="400" rx="24" fill="#eaf3ff"/>
<path d="M120 38h240v324l-20-9-20 9-20-9-20 9-20-9-20 9-20-9-20 9-20-9-20 9-20-9-20 9z" fill="white" stroke="#b4cbed" stroke-width="2"/>
<rect x="148" y="68" width="184" height="40" rx="6" fill="#1759c2"/>
<g font-family="Arial,sans-serif"><text x="240" y="94" text-anchor="middle" fill="white" font-size="17" font-weight="700">BOLETA · EJEMPLO</text>
<text x="148" y="147" fill="#123d91" font-size="16">Sal · 2 sacos</text><text x="148" y="177" fill="#526880" font-size="14">Presentación: 25 kg</text><path d="M148 197h184" stroke="#dce6f4"/>
<text x="148" y="230" fill="#123d91" font-size="20" font-weight="700">2 × 25 kg = 50 kg</text>
<rect x="148" y="256" width="184" height="48" rx="8" fill="#fff3df"/><text x="240" y="285" text-anchor="middle" fill="#79500f" font-size="15">Revisar y confirmar</text></g></svg>
